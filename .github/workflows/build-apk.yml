name: Build Xianyu Copilot APK

on:
  push:
    branches: [ "main", "feat/**" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-xianyu-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk ../dist/XianyuCopilot.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XianyuCopilot-APK
          path: dist/XianyuCopilot.apk
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "Xianyu Copilot v1.1.0 (多账号管理 · 扫码登录+网页登录+首屏修复)"
          target_commitish: ${{ github.sha }}
          prerelease: false
          files: dist/XianyuCopilot.apk
          body: |
            ### 🐟 闲鱼管家 Xianyu Copilot v1.1.0

            本次更新重点解决首屏状态卡死问题，全面升级多账号管理与三种登录体系：

            - 🛠️ **修复首屏加载卡死与图标丢失**：
              - 根除前端脚本闭合异常，空状态自动引导，绝不再卡在「正在同步会话流」；
              - 全面采用纯原生 inline SVG 图标，彻底摆脱外部 CDN 依赖，离线秒显；
            - 👥 **多账号管理体系 (Multi-Account Management)**：
              - 支持同时添加多个闲鱼掌柜账号，清晰查看各账号 UID、昵称与登录保鲜状态；
              - 支持单点丝滑一键切换当前工作账号；
              - 支持一键删除无用失效凭据；
            - 📷 **官方扫码登录 (QR Code Login)**：
              - 对接淘宝/闲鱼官方扫码网关，自动生成登录二维码与实时状态轮询；
              - 手机闲鱼扫码确认后，自动截获完整 Cookie、解析用户标识并自动激活入库；
            - 🌐 **内嵌网页授权登录 (In-App Web Login)**：
              - 支持在 App 内直接拉起官方登录窗口（支持短信验证码 / 密码 / 手机淘宝一键授权）；
              - 登录成功后 Android CookieManager 自动截获 Cookie 并同步入库；
            - 📋 **Cookie 导入与检测**：
              - 支持手动粘贴 Cookie 字符串，自动测试有效性并绑定；
            - 🛡️ **非破坏性更新与平滑升级**：
              - versionCode 递增至 2，固化永久签名证书，手机端直接覆盖安装，已有卡密、发货规则与数据 100% 完好保留！

            *点击下方 Assets 里的 `XianyuCopilot.apk` 即可下载安装！*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
