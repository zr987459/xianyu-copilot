name: Build Xianyu Copilot APK

on:
  push:
    branches: [ "main", "feat/**" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-xianyu-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk ../dist/XianyuCopilot.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XianyuCopilot-APK
          path: dist/XianyuCopilot.apk
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "Xianyu Copilot v1.2.0 (自动发货深度优化 · 一单多件 + 幂等防重发 + 全新界面)"
          target_commitish: ${{ github.sha }}
          prerelease: false
          files: dist/XianyuCopilot.apk
          body: |
            ### 🐟 闲鱼管家 Xianyu Copilot v1.2.0

            本次更新重点深度优化「自动发货」引擎，并全面重做前端界面（五页签）。

            - 🚚 **自动发货深度优化（参考成熟开源项目）**：
              - **一单多件**：自动解析 buyAmount / buyQuantity，拍 N 件精准出库 N 张卡密；
              - **规格 SKU 精准匹配**：同一关键词下不同规格（月卡/季卡）各自独立出库，杜绝错发；
              - **复合发货**：独享卡密 + 固定网盘链接/使用说明 同时下发；
              - **幂等防重发**：同一订单绝不二次发货（数据库 + 流水双重校验）；
            - 🎨 **全新五页签界面**：
              - 发货：守护开关、待发货订单列表（支持一键手动发货）、实时发货流水；
              - 卡密：批量导入、库存分布统计、在库/已发明细核销状态；
              - 规则：关键词 + 规格 + 固定附言 + 发货确认语 + 卡密池开关；
              - 账号：当前账号卡片、已绑定账号列表（切换/删除）；
              - 上架：免浏览器一键发布宝贝；
            - 🔐 **三种登录方式全部就位**：
              - 📷 扫码登录（弹窗展示二维码 + 实时状态轮询：等待/已扫码/成功/过期）；
              - 🌐 网页登录（App 内 WebView 授权）；
              - 🔑 Cookie 粘贴导入（自动校验有效性并绑定账号）；
            - ⚡ **技术细节**：
              - 新增 `GET /api/orders/waiting` 真实待发货订单接口；
              - 新增 `POST /api/delivery/ship_now` 手动一键发货接口；
              - 纯内联 SVG 图标，零 CDN 依赖，离线秒开。
