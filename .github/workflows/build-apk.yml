name: Build Xianyu Copilot APK

on:
  push:
    branches: [ "main", "feat/**" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-xianyu-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk ../dist/XianyuCopilot.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XianyuCopilot-APK
          path: dist/XianyuCopilot.apk
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: "Xianyu Copilot v1.3.0 (登录模块全面重写 · 令牌自愈 + 安全加固)"
          files: dist/XianyuCopilot.apk
          body: |
            ### 🐟 闲鱼管家 Xianyu Copilot v1.3.0

            本次重点**完全重写登录模块**，并做了安全加固与令牌自愈。

            #### 🔐 登录模块重写（对应 19 项缺陷修复）

            **一、扫码登录（整条链路换掉）**
            - 旧实现走 `qrlogin.taobao.com`，全程拿不到 goofish 域 Cookie，业务接口必然失败；
            - 新实现对齐官方真实链路：`passport.goofish.com/mini_login.htm` → `generate.do` → `query.do`；
            - 二维码不再空白：`codeContent` 是**二维码内容**不是图片地址，现用 ZXing 本地渲染成 PNG；
            - 每个扫码会话独立 CookieJar（旧版全局单例会被第二个弹窗冲掉）；
            - 正确回传 `t` / `ck`，并支持风控触发时的二次验证引导；
            - 失败/过期/风控都会明确提示，不再静默卡在「等待扫码」。

            **二、网页登录**
            - 统一 JS 桥名 `AndroidBridge`（旧版 Kotlin 注册小写、前端查大写，必然报「环境不支持」）；
            - 登录前清空旧 Cookie，避免上一账号 cookie 混入；
            - 登录完成后先访问 `www.goofish.com` 拿 `cookie2` / `_m_h5_tk`，再读取；
            - Cookie 按名字去重、闲鱼域优先，不再出现重复字段与空段；
            - `onPageFinished` 加一次性标志，不再重复起线程写库。

            **三、Cookie 导入**
            - 校验失败**不再激活**，绝不会顶掉当前正常账号；仅保存并明确告知原因。

            **四、通用加固**
            - 新增 `AccountManager.saveLogin()` 统一去重/补令牌/校验/激活策略（旧版三处各写一遍）；
            - 缺少 `unb` 一律判定失败，**绝不编造用户 ID**（旧版会拿 tracknick 甚至时间戳顶替，导致重复记录）；
            - **mtop 令牌自愈**：命中 `FAIL_SYS_TOKEN_EMPTY/EXPIRED` 时自动读取 `Set-Cookie` 新 `_m_h5_tk`，
              成对合并 `_m_h5_tk_enc`、写回数据库、重签重试一次；按账号 single-flight 防并发互盖；
            - 有效性不再是「cookie 非空」：记录最近一次真实校验结果，失效时**通知栏主动提醒**；
            - `testCookie` 改用官方 `mtop.taobao.idlemessage.pc.loginuser.get`（原接口未经证实）。

            #### 🛡️ 安全加固
            - 本地 `127.0.0.1:9005/api/*` 全部接口需携带启动时随机生成的令牌，否则 **401**；
            - 移除 `Access-Control-Allow-Origin: *`，手机上任意外部网页无法再调用导入/切换/删除账号接口；
            - 账号 Cookie 改用 **AES-GCM + Android Keystore** 加密落库（密钥不可导出）；
            - `allowBackup=false` + 数据提取规则排除数据库，防止备份泄露登录凭据。

            #### ✅ 验收要点
            - 三种登录方式成功后，账号列表**只新增一条**记录；
            - 登录后立即查询订单即可成功；手动把 `_m_h5_tk` 改坏，下一次调用会自动刷新并成功；
            - 登录失败不会顶掉当前激活账号；
            - 外部请求 `127.0.0.1:9005/api/stats`（不带令牌）返回 401。
