name: Build Xianyu Copilot APK

on:
  push:
    branches: [ "main", "feat/**", "fix/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

# 按分支分组：fix/** 的构建不会再取消 main 的发布
concurrency:
  group: build-xianyu-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x android/gradlew

      # 版本号统一取自 build.gradle.kts，tag / 标题不再写死
      - name: Resolve Version
        run: |
          set -euo pipefail
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts | head -n1)
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "REL_TAG=v$VER" >> "$GITHUB_ENV"
            echo "REL_PRE=false" >> "$GITHUB_ENV"
          else
            SLUG=$(echo "${GITHUB_REF_NAME}" | tr '/' '-' | tr -cd 'A-Za-z0-9._-')
            echo "REL_TAG=v$VER-$SLUG" >> "$GITHUB_ENV"
            echo "REL_PRE=true" >> "$GITHUB_ENV"
          fi
          NOTES="docs/release-notes/v$VER.md"
          [ -f "$NOTES" ] || NOTES=""
          echo "REL_NOTES=$NOTES" >> "$GITHUB_ENV"

      # 签名材料全部来自 Actions Secrets，仓库里不再存放 keystore 与明文密码。
      # 解码到 runner 临时目录，构建结束后随 runner 一起销毁。
      - name: Prepare Signing Key
        env:
          KS_B64: ${{ secrets.XIANYU_KS_B64 }}
          KS_PASS: ${{ secrets.XIANYU_KS_PASS }}
          KEY_PASS: ${{ secrets.XIANYU_KEY_PASS }}
          KS_ALIAS: ${{ secrets.XIANYU_KS_ALIAS }}
          OLD_KS_B64: ${{ secrets.XIANYU_OLD_KS_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${KS_B64:-}" ]; then
            echo "::error::缺少 XIANYU_KS_B64，无法签名发布"
            exit 1
          fi
          KS_DIR="$RUNNER_TEMP/ks"
          mkdir -p "$KS_DIR"
          echo "$KS_B64" | base64 -d > "$KS_DIR/release.jks"
          echo "XIANYU_KS_PATH=$KS_DIR/release.jks" >> "$GITHUB_ENV"
          echo "XIANYU_KS_PASS=${KS_PASS}" >> "$GITHUB_ENV"
          echo "XIANYU_KEY_PASS=${KEY_PASS:-$KS_PASS}" >> "$GITHUB_ENV"
          echo "XIANYU_KS_ALIAS=${KS_ALIAS:-xianyu}" >> "$GITHUB_ENV"
          if [ -n "${OLD_KS_B64:-}" ]; then
            echo "$OLD_KS_B64" | base64 -d > "$KS_DIR/old.jks"
            echo "XIANYU_OLD_KS_PATH=$KS_DIR/old.jks" >> "$GITHUB_ENV"
          fi

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk ../dist/XianyuCopilot-unsigned.apk

      # v3 密钥轮换（带双签名者覆盖）：
      # 当有 lineage 时，旧 signer 签低版本 SDK（保证老系统覆盖），新 signer 签高版本 SDK；
      # Android 9+ 通过 lineage 认新钥为旧钥的合法继承者，实现无感平滑覆盖升级。
      - name: Sign APK with Key Rotation Lineage
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          APKSIGNER="$BT/apksigner"
          [ -x "$APKSIGNER" ] || APKSIGNER="java -jar $BT/lib/apksigner.jar"

          UNSIGNED=dist/XianyuCopilot-unsigned.apk
          OUT=dist/XianyuCopilot.apk

          if [ -f android/xianyu-lineage.bin ] && [ -n "${XIANYU_OLD_KS_PATH:-}" ]; then
            $APKSIGNER sign \
              --ks "$XIANYU_OLD_KS_PATH" --ks-pass "pass:cookiebox123" --ks-key-alias "cookiebox" \
              --next-signer \
              --ks "$XIANYU_KS_PATH" --ks-pass "pass:$XIANYU_KS_PASS" \
              --ks-key-alias "$XIANYU_KS_ALIAS" --key-pass "pass:$XIANYU_KEY_PASS" \
              --lineage android/xianyu-lineage.bin \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              --out "$OUT" "$UNSIGNED"
          else
            $APKSIGNER sign \
              --ks "$XIANYU_KS_PATH" --ks-pass "pass:$XIANYU_KS_PASS" \
              --ks-key-alias "$XIANYU_KS_ALIAS" --key-pass "pass:$XIANYU_KEY_PASS" \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              --out "$OUT" "$UNSIGNED"
          fi

          rm -f "$UNSIGNED"
          $APKSIGNER verify --print-certs "$OUT" | head -n 20

      # 签名指纹校验：证书 SHA-256 与预期不一致则直接失败，防止误用密钥。
      - name: Verify Signing Certificate
        env:
          EXPECTED_SHA256: ${{ secrets.XIANYU_CERT_SHA256 }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          APKSIGNER="$BT/apksigner"
          [ -x "$APKSIGNER" ] || APKSIGNER="java -jar $BT/lib/apksigner.jar"
          ACTUAL=$($APKSIGNER verify --print-certs dist/XianyuCopilot.apk \
                   | grep -i "SHA-256" | head -n1 | awk -F': ' '{print $2}' | tr -d ' ' | tr '[:lower:]' '[:upper:]')
          echo "实际证书 SHA-256: $ACTUAL"
          if [ -n "${EXPECTED_SHA256:-}" ] && [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "::error::签名证书指纹不匹配！预期 $EXPECTED_SHA256，实际 $ACTUAL"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XianyuCopilot-APK
          path: dist/XianyuCopilot.apk
          retention-days: 14

      # main 发正式版（tag = v<versionName>）；fix/** 与 feat/** 推送发「测试预发布」供真机安装
      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REL_TAG }}
          target_commitish: ${{ github.sha }}
          name: "Xianyu Copilot ${{ env.REL_TAG }}"
          prerelease: ${{ env.REL_PRE }}
          make_latest: ${{ env.REL_PRE == 'false' }}
          files: dist/XianyuCopilot.apk
          body_path: ${{ env.REL_NOTES }}
          fail_on_unmatched_files: true
